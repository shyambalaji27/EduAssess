<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile | EduAssess</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</head>
<body style="background-color: var(--bg);">

  <!-- Top Navbar -->
  <header class="top-navbar">
    <div class="nav-left">
      <a href="index.html" class="brand-logo" style="text-decoration:none;">
        <div class="brand-icon">👤</div>
        <span>EduAssess Profile</span>
      </a>
    </div>
    <div class="nav-right">
      <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle theme">🌙</button>
      <a id="back-to-dashboard-btn" href="student-dashboard.html" class="btn btn-sm btn-secondary">
        &larr; Back to Dashboard
      </a>
      <button class="btn btn-sm btn-danger btn-logout">Sign Out</button>
    </div>
  </header>

  <main class="dashboard-content" style="max-width:850px; padding:2.5rem 1.5rem;">
    <!-- Profile Card -->
    <div class="card" style="margin-bottom:2rem;">
      <div style="display:flex; align-items:center; gap:1.5rem; flex-wrap:wrap; padding-bottom:1.5rem; border-bottom:1px solid var(--border);">
        <div class="user-avatar" style="width:72px; height:72px; font-size:2rem;" id="prof-avatar">U</div>
        <div>
          <h2 id="prof-name" style="font-size:1.6rem; font-weight:800; margin-bottom:0.25rem;">User Name</h2>
          <div style="display:flex; align-items:center; gap:0.5rem;">
            <span id="prof-role-badge" class="badge badge-primary">STUDENT</span>
            <span class="text-muted" id="prof-id-display">ID: STU001</span>
          </div>
        </div>
      </div>

      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:1.5rem; margin-top:1.5rem;">
        <div>
          <span style="font-size:0.75rem; font-weight:700; text-transform:uppercase; color:var(--text-muted); display:block;">Email Address</span>
          <strong id="prof-email" style="font-size:1rem; color:var(--text);">-</strong>
        </div>

        <div>
          <span style="font-size:0.75rem; font-weight:700; text-transform:uppercase; color:var(--text-muted); display:block;">Department</span>
          <strong id="prof-dept" style="font-size:1rem; color:var(--text);">-</strong>
        </div>

        <div>
          <span style="font-size:0.75rem; font-weight:700; text-transform:uppercase; color:var(--text-muted); display:block;">Academic Year / Status</span>
          <strong id="prof-year" style="font-size:1rem; color:var(--text);">-</strong>
        </div>

        <div>
          <span style="font-size:0.75rem; font-weight:700; text-transform:uppercase; color:var(--text-muted); display:block;">Account Registered</span>
          <strong id="prof-joined" style="font-size:1rem; color:var(--text);">-</strong>
        </div>
      </div>
    </div>

    <!-- Change Password Form -->
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">Security & Password Management</h3>
      </div>

      <form id="profile-password-form">
        <div class="form-group">
          <label class="form-label" for="curr-password">Current Password</label>
          <input type="password" id="curr-password" class="form-control" placeholder="Enter current password" required />
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
          <div class="form-group">
            <label class="form-label" for="new-password">New Password</label>
            <input type="password" id="new-password" class="form-control" placeholder="Minimum 6 characters" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="confirm-password">Confirm New Password</label>
            <input type="password" id="confirm-password" class="form-control" placeholder="Re-enter new password" required />
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top:0.5rem;">
          Update Password
        </button>
      </form>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = window.OES_Auth ? window.OES_Auth.getCurrentUser() : null;
      if (!user) {
        window.location.href = 'index.html';
        return;
      }

      // Fill Details
      document.getElementById('prof-name').textContent = user.name || user.username;
      document.getElementById('prof-avatar').textContent = (user.name || user.username).charAt(0).toUpperCase();
      document.getElementById('prof-id-display').textContent = `ID: ${user.id || user.username}`;
      document.getElementById('prof-email').textContent = user.email || 'N/A';
      document.getElementById('prof-dept').textContent = user.department || 'General';
      document.getElementById('prof-year').textContent = user.year || (user.role === 'admin' ? 'Administrator' : 'N/A');
      document.getElementById('prof-joined').textContent = user.createdAt || '2026-01-01';

      const roleBadge = document.getElementById('prof-role-badge');
      roleBadge.textContent = user.role.toUpperCase();
      roleBadge.className = user.role === 'admin' ? 'badge badge-primary' : 'badge badge-secondary';

      const backBtn = document.getElementById('back-to-dashboard-btn');
      backBtn.href = user.role === 'admin' ? 'admin-dashboard.html' : 'student-dashboard.html';

      // Password Form
      const form = document.getElementById('profile-password-form');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const curr = document.getElementById('curr-password').value;
        const newP = document.getElementById('new-password').value;
        const conf = document.getElementById('confirm-password').value;

        if (curr !== user.password) {
          window.OES_App.showToast('Incorrect current password.', 'danger');
          return;
        }

        if (newP.length < 6) {
          window.OES_App.showToast('New password must be at least 6 characters long.', 'warning');
          return;
        }

        if (newP !== conf) {
          window.OES_App.showToast('New passwords do not match.', 'danger');
          return;
        }

        user.password = newP;
        window.OES_Storage.saveUser(user);
        sessionStorage.setItem('oes_current_user', JSON.stringify(user));
        form.reset();
        window.OES_App.showToast('Password updated successfully!', 'success');
      });
    });
  </script>
</body>
</html>
